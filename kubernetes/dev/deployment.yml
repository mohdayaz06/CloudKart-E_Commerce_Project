apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudkart-app
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudkart-app
  template:
    metadata:
      labels:
        app: cloudkart-app
    spec:
      containers:
      - name: cloudkart-app
        image: mohdayazz/cloudkart:latest
        ports:
        - containerPort: 3000
